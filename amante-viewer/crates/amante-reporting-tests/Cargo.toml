[package]
name = "amante-reporting-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Compile the actual reporting modules without the renderer/desktop test
# executable, which exceeds small runners' memory. No copied implementation.
[dev-dependencies]
aurora-version = { version = "0.1.0", path = "../aurora-version" }
aurora-i18n = { version = "0.1.0", path = "../aurora-i18n" }
aurora-updater = { version = "0.1.0", path = "../aurora-updater" }
crossbeam-channel = "0.5.17"
amante-keyring = { path = "../amante-keyring" }
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt", "time"] }

[lints]
workspace = true
