[package]
name = "amante-keyring"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# OpenSSL avoids the alternate backend's legacy RustCrypto/digest dependency.
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-openssl", "vendored"] }

[lints]
workspace = true
