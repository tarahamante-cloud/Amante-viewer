[package]
name = "amante-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "1.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same Secret Service collection/attributes as the old zbus store, with an
# encrypted session. The maintained libdbus transport avoids zbus 5 entirely.
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "6.2.1"
crossbeam-channel = "0.5"
log = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont"] }

[lints]
workspace = true
