name: Amante native checks and Windows download

on:
  workflow_dispatch:
  pull_request:
    paths: ["amante-viewer/**", ".github/workflows/amante-build.yml", "scripts/**"]
  push:
    branches: [main]
    paths: ["amante-viewer/**", ".github/workflows/amante-build.yml", "scripts/**"]

permissions:
  contents: read

concurrency:
  group: amante-build-${{ github.ref }}
  # Preserve an almost-finished native build and its cache while a corrected
  # candidate queues behind it; publication still requires every check.
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: amante-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify clean upstream runtime and branding inventory
        run: python3 ../scripts/verify-clean-upstream.py . --require-tracked
      - name: Verify dependency security exception stays narrow
        run: python3 ../scripts/test-clean-upstream-security.py
      - name: Install native Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev libfreetype6-dev libfontconfig1-dev dbus gnome-keyring vulkan-tools unzip
          # Pin the headless Vulkan test driver and verify the downloaded archive.
          # SwiftShader passes the upstream terrain filtering reference test;
          # this changes only the CI test adapter, never the viewer or renderer.
          swiftshader="$RUNNER_TEMP/swiftshader"
          archive="$RUNNER_TEMP/swiftshader-ubuntu-24.04-x64.zip"
          mkdir -p "$swiftshader"
          curl --fail --location --silent --show-error \
            https://github.com/NcStudios/VulkanCI/releases/download/v1.3/swiftshader-ubuntu-24.04-x64.zip \
            --output "$archive"
          echo "a04e4921802a004e6f2278d2df1fc894379b8ea7358c15e6d0bea5f79e51372d  $archive" | sha256sum --check
          unzip -q "$archive" -d "$swiftshader"
          test -f "$swiftshader/libvk_swiftshader.so"
          cat > "$swiftshader/vk_swiftshader_icd.json" <<EOF
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "$swiftshader/libvk_swiftshader.so",
              "api_version": "1.0.5"
            }
          }
          EOF
          runtime="$RUNNER_TEMP/amante-xdg"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "VK_DRIVER_FILES=$swiftshader/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$swiftshader/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$swiftshader:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$swiftshader/vk_swiftshader_icd.json" VK_ICD_FILENAMES="$swiftshader/vk_swiftshader_icd.json" LD_LIBRARY_PATH="$swiftshader:$LD_LIBRARY_PATH" XDG_RUNTIME_DIR="$runtime" vulkaninfo --summary
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
      - name: Formatting and upstream offline regression tests
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo fmt --all --check
          cargo check --profile ci --workspace --all-targets --locked
          cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings -A dead_code
          # The complete viewer test executable exceeds small runners' memory.
          # Compile-check it above; retain/run network + updater fixtures here.
          cargo test --profile ci --workspace --exclude aurora-viewer --locked
          cargo test --profile ci --locked -p aurora-i18n
          cargo test --profile ci --workspace --locked --test updates
          bash ../scripts/test-native-credentials.sh
      - name: Build native Linux viewer without signing in
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build --profile ci --locked -p aurora-viewer
          ./target/ci/aurora-viewer --version

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        shell: pwsh
        working-directory: amante-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify clean upstream runtime and branding inventory
        run: python ../scripts/verify-clean-upstream.py . --require-tracked
      - name: Build complete native Windows x64 viewer
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          cargo build --release --locked -p aurora-viewer
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows build failed.' }
      - name: Package executable, assets, licenses and checksum
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/release/aurora-viewer.exe'
          $version = (& $exe --version | Out-String).Trim() -replace '^Amante Viewer ', ''
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.+-]+)?$') { throw 'Invalid Amante build version.' }
          $name = "Amante-Viewer-v$version-windows-x64"
          $folder = Join-Path '../generated-artifacts' $name
          ./scripts/package.ps1 -Exe $exe -Out $folder
          if (!(Test-Path (Join-Path $folder 'amante-viewer.exe'))) { throw 'Amante executable missing.' }
          $zip = "$folder.zip"
          Compress-Archive -LiteralPath $folder -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $name.zip`n", [Text.UTF8Encoding]::new($false))
          ../scripts/verify-clean-windows-package.ps1 -Zip $zip -Evidence ../generated-artifacts/windows-package-verification.json
          Copy-Item amante-upstream-manifest.json ../generated-artifacts/source-preservation.json
      - name: Downloadable Windows build, not a published release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Amante-Viewer-windows-x64
          path: |
            generated-artifacts/*.zip
            generated-artifacts/*.sha256
            generated-artifacts/windows-package-verification.json
            generated-artifacts/source-preservation.json
          if-no-files-found: error
          retention-days: 14

  windows-tests:
    # Public-repository Windows runners provide more memory than this Replit.
    # Record actual capacity; a build or compile-check is not a test result.
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        shell: pwsh
        working-directory: amante-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify clean upstream runtime and branding inventory
        run: python ../scripts/verify-clean-upstream.py . --require-tracked
      - name: Full offline native unit and integration harness
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup override set 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed.' }
          ../scripts/test-clean-windows-offline.ps1 -Out ../generated-artifacts/windows-tests
      - name: Preserve actual harness results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Amante-Windows-offline-test-evidence
          path: generated-artifacts/windows-tests/
          if-no-files-found: warn
          retention-days: 14
