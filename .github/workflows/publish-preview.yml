name: Publish approved Amante Windows preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Amante Windows build run ID
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Download and verify the successful CI package
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_json="$(mktemp)"
          artifact_json="$(mktemp)"
          gh api "repos/$repo/actions/runs/$RUN_ID" > "$run_json"
          jq -e \
            '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .name == "Amante native checks and Windows download"' \
            "$run_json" >/dev/null

          commit="$(jq -r '.head_sha' "$run_json")"
          gh api "repos/$repo/actions/runs/$RUN_ID/artifacts" > "$artifact_json"
          artifact_id="$(jq -er \
            '[.artifacts[] | select(.name == "Amante-Viewer-windows-x64" and .expired == false)] | sort_by(.created_at) | last | .id' \
            "$artifact_json")"

          mkdir package
          gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > package/actions-artifact.zip
          unzip -tqq package/actions-artifact.zip
          package_name="$(unzip -Z1 package/actions-artifact.zip | grep -E '^Amante-Viewer-v[0-9][^/]*-windows-x64\.zip$' | head -n 1)"
          test -n "$package_name"
          unzip -p package/actions-artifact.zip "$package_name" > "package/$package_name"
          unzip -p package/actions-artifact.zip "$package_name.sha256" > "package/$package_name.sha256"
          (
            cd package
            sha256sum --check "$package_name.sha256"
            unzip -tqq "$package_name"
          )
          unzip -p package/actions-artifact.zip windows-package-verification.json > package/verification.json
          jq -e '.extractedCli | startswith("passed: --version")' package/verification.json >/dev/null

          version="${package_name#Amante-Viewer-v}"
          version="${version%-windows-x64.zip}"
          release_version="${version%%+*}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          compatibility_name="Amante-Viewer-v$release_version-windows-x64.zip"
          public_name="Amante-Viewer-Alpha-windows-x64.zip"
          if [[ "$package_name" != "$compatibility_name" ]]; then
            cp "package/$package_name" "package/$compatibility_name"
          fi
          cp "package/$package_name" "package/$public_name"
          (
            cd package
            sha256sum "$compatibility_name" > "$compatibility_name.sha256"
            sha256sum "$public_name" > "$public_name.sha256"
          )
          {
            echo "COMMIT=$commit"
            echo "VERSION=$release_version"
            echo "RELEASE_TAG=v$release_version"
            echo "COMPATIBILITY_NAME=$compatibility_name"
            echo "PUBLIC_NAME=$public_name"
          } >> "$GITHUB_ENV"

      - name: Publish the verified Windows preview
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh release create "$RELEASE_TAG" \
            "package/$COMPATIBILITY_NAME" \
            "package/$COMPATIBILITY_NAME.sha256" \
            "package/$PUBLIC_NAME" \
            "package/$PUBLIC_NAME.sha256" \
            --repo "$repo" \
            --target "$COMMIT" \
            --title "Amante Viewer Alpha v$VERSION" \
            --notes "Amante Viewer Alpha v$VERSION, built from commit $COMMIT. Includes the full official Aurora v0.9.6 release (019d41a5ba4b87fb2f6e7072ae5c003b31017c26): outfit gallery and portraits, photo LUTs and stars, graphics and memory improvements, avatar and poser updates, inventory, building, sound and movement fixes. Optional paid upstream services remain subject to their own availability. The protected engine source is byte-identical to that official release. Amante retains its branding, crest, palette, settings, saved accounts, credential namespaces, owner update feed, maintained dependencies and local-peer protections. A Windows desktop shortcut is created on the first normal launch from the extracted folder; keep that folder in place. Published releases are detected at login unless update notices are disabled or this version was skipped. This is unsigned Alpha preview software, not a final release. The public Windows x64 download does not require a GitHub sign-in. Passing builds and offline tests do not prove rendering in a logged-in Second Life session. Verify the accompanying SHA-256 checksum before installing."

          release_url="https://github.com/$repo/releases/tag/$RELEASE_TAG"
          echo "Published $release_url" >> "$GITHUB_STEP_SUMMARY"
