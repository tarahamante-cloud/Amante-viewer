name: Publish approved Amante Windows preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Amante Windows build run ID
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only this environment can read UPDATE_SIGNING_KEY (main branch only).
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Download and verify the successful CI package
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_json="$(mktemp)"
          artifact_json="$(mktemp)"
          gh api "repos/$repo/actions/runs/$RUN_ID" > "$run_json"
          jq -e \
            '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .name == "Amante native checks and Windows download"' \
            "$run_json" >/dev/null

          commit="$(jq -r '.head_sha' "$run_json")"
          gh api "repos/$repo/actions/runs/$RUN_ID/artifacts" > "$artifact_json"
          artifact_id="$(jq -er \
            '[.artifacts[] | select(.name == "Amante-Viewer-windows-x64" and .expired == false)] | sort_by(.created_at) | last | .id' \
            "$artifact_json")"

          mkdir package
          gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > package/actions-artifact.zip
          unzip -tqq package/actions-artifact.zip
          package_name="$(unzip -Z1 package/actions-artifact.zip | grep -E '^Amante-Viewer-v[0-9][^/]*-windows-x64\.zip$' | head -n 1)"
          test -n "$package_name"
          unzip -p package/actions-artifact.zip "$package_name" > "package/$package_name"
          unzip -p package/actions-artifact.zip "$package_name.sha256" > "package/$package_name.sha256"
          (
            cd package
            sha256sum --check "$package_name.sha256"
            unzip -tqq "$package_name"
          )
          unzip -p package/actions-artifact.zip windows-package-verification.json > package/verification.json
          jq -e '.extractedCli | startswith("passed: --version")' package/verification.json >/dev/null

          version="${package_name#Amante-Viewer-v}"
          version="${version%-windows-x64.zip}"
          release_version="${version%%+*}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          compatibility_name="Amante-Viewer-v$release_version-windows-x64.zip"
          public_name="Amante-Viewer-Alpha-windows-x64.zip"
          if [[ "$package_name" != "$compatibility_name" ]]; then
            cp "package/$package_name" "package/$compatibility_name"
          fi
          cp "package/$package_name" "package/$public_name"
          (
            cd package
            sha256sum "$compatibility_name" > "$compatibility_name.sha256"
            sha256sum "$public_name" > "$public_name.sha256"
          )
          {
            echo "COMMIT=$commit"
            echo "VERSION=$release_version"
            echo "RELEASE_TAG=v$release_version"
            echo "COMPATIBILITY_NAME=$compatibility_name"
            echo "PUBLIC_NAME=$public_name"
          } >> "$GITHUB_ENV"

      - name: Sign the update checksum for the in-viewer updater
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$UPDATE_SIGNING_KEY"
          key="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          public="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          # The key must be one the released viewer trusts (RELEASE_KEYS).
          gh api "repos/$GITHUB_REPOSITORY/contents/amante-viewer/crates/aurora-updater/src/signature.rs?ref=$COMMIT" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/signature.rs"
          sed -n '/release-keys-begin/,/release-keys-end/p' "$RUNNER_TEMP/signature.rs" | grep -qi "\"$public\""
          sidecar="package/$COMPATIBILITY_NAME.sha256"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$sidecar" -out "$sidecar.sig"
          test "$(stat -c %s "$sidecar.sig")" -eq 64
          # Verify the written signature with the public key before publishing.
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update-signing.pub"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-signing.pub" -in "$sidecar" -sigfile "$sidecar.sig"

      - name: Publish the verified Windows preview
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh release create "$RELEASE_TAG" \
            "package/$COMPATIBILITY_NAME" \
            "package/$COMPATIBILITY_NAME.sha256" \
            "package/$COMPATIBILITY_NAME.sha256.sig" \
            "package/$PUBLIC_NAME" \
            "package/$PUBLIC_NAME.sha256" \
            --repo "$repo" \
            --target "$COMMIT" \
            --title "Amante Viewer Alpha v$VERSION" \
            --notes "Amante Viewer Alpha v$VERSION, built from commit $COMMIT. Integrates official Aurora Viewer v0.9.13, including the cumulative 0.9.12 update: 15 interface languages, Game Controls, world photo looks and LUTs, and updates to chat, avatars and inventory. Newer features include Phototools lighting and depth-of-field controls, ray-traced shadows and indirect lighting, optional planet curvature, improved outfits, Contacts, materials, camera controls, and many fixes across chat, inventory, avatars and RLVa. The complete engine source is byte-identical to official Aurora v0.9.13; it was not locally rewritten. Amante retains its branding, crest, palette, settings, saved accounts, credential namespaces, owner update feed, maintained dependencies and local-peer protections. Blender retains Amante's mutual session pairing: use the Amante addon. Director recording requires ffmpeg. Settings are kept; the first region may load more slowly while the cache rebuilds. A Windows desktop shortcut is created on the first normal launch from the extracted folder; keep that folder in place. Published releases are detected at login unless update notices are disabled or this version was skipped. This is unsigned Alpha preview software, not a final release. The public Windows x64 download does not require a GitHub sign-in. Passing builds and offline tests do not prove rendering in a logged-in Second Life session. Verify the accompanying SHA-256 checksum before installing."

          release_url="https://github.com/$repo/releases/tag/$RELEASE_TAG"
          echo "Published $release_url" >> "$GITHUB_STEP_SUMMARY"
